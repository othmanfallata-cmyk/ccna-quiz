<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار CCNA التفاعلي - النسخة الشاملة (77 سؤالاً)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --success: #10b981;
            --error: #ef4444;
            --info-bg: #eff6ff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 30px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            margin: 0;
            color: var(--primary);
            font-size: 24px;
        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 10px;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #111827;
            direction: ltr;
            text-align: right;
        }

        .exhibit-container {
            text-align: center;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .exhibit-container img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .question-hint {
            font-size: 13px;
            color: #d97706;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .option-item {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            direction: ltr;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-item:hover {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .option-item.selected {
            border-color: var(--primary);
            background: #dbeafe;
            font-weight: bold;
        }

        .option-item.correct {
            background: #d1fae5 !important;
            border-color: var(--success) !important;
            color: #065f46 !important;
            font-weight: bold;
        }

        .option-item.incorrect {
            background: #fee2e2 !important;
            border-color: var(--error) !important;
            color: #991b1b !important;
        }

        .option-item.disabled {
            cursor: not-allowed;
        }

        .explanation-box {
            display: none;
            background-color: var(--info-bg);
            border-right: 4px solid var(--primary);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 15px;
            color: #1e3a8a;
            text-align: right;
            line-height: 1.6;
        }

        .explanation-box h4 {
            margin: 0 0 5px 0;
            color: var(--primary-dark);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            color: var(--primary);
            font-size: 28px;
        }

        .score-badge {
            font-size: 48px;
            font-weight: bold;
            color: var(--success);
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>اختبار CCNA التفاعلي - النسخة الشاملة</h1>
        </header>

        <div id="quiz-box">

        </div>
    </div>

    <script>
        const questions = [
            {

            {

                explanation: "الجواب الصحيح هو B (IPsec tunnel mode with ESP). وضع النفق (Tunnel mode) يغلف ويشفر حزمة IP الأصلية بالكامل، بينما بروتوكول ESP يوفر التشفير وضمان السرية والسلامة."
            },
            {
                id: 100,
                exhibit: null,
                question: "Which two outcomes are predictable behaviors for HSRP? (Choose two.)",
                type: "multiple",
                options: [
                    "A. The two routers share the same interface IP address, and default gateway traffic is load-balanced between them.",
                    "B. The two routers synchronize configurations to provide consistent packet forwarding.",
                    "C. The two routers negotiate one router as the active router and the other as the standby router.",
                    "D. Each router has a different IP address, both routers act as the default gateway on the LAN, and traffic is load-balanced between them.",
                    "E. The two routers share a virtual IP address that is used as the default gateway for devices on the LAN."
                ],
                correct: [2, 4],
                explanation: "الإجابتان الصحيحتان هما C و E. في بروتوكول HSRP، يتفاوض الموجهان ليصبح أحدهما نشطاً (Active) والآخر احتياطياً (Standby)، ويتشاركان عنوان IP افتراضياً يُستخدم كبوابة افتراضية للأجهزة على الشبكة المحلية."
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let selectedOptions = [];
        let answered = false;

        const questionText = document.getElementById("question-text");
        const questionHint = document.getElementById("question-hint");
        const optionsList = document.getElementById("options-list");
        const nextBtn = document.getElementById("next-btn");
        const questionProgress = document.getElementById("question-progress");
        const scoreTracker = document.getElementById("score-tracker");
        const quizBox = document.getElementById("quiz-box");
        const resultBox = document.getElementById("result-box");
        const finalScore = document.getElementById("final-score");
        
        const exhibitBox = document.getElementById("exhibit-box");
        const exhibitImg = document.getElementById("exhibit-img");
        
        const explanationBox = document.getElementById("explanation-box");
        const explanationText = document.getElementById("explanation-text");

        function loadQuestion() {
            answered = false;
            selectedOptions = [];
            nextBtn.style.display = "none";
            explanationBox.style.display = "none";
            
            const q = questions[currentIdx];
            
            questionProgress.innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
            questionText.innerText = q.question;

            if (q.exhibit) {
                exhibitImg.src = q.exhibit;
                exhibitBox.style.display = "block";
            } else {
                exhibitBox.style.display = "none";
            }

            if (q.type === "multiple") {
                questionHint.innerText = "اختر خيارين (Choose two) وسيتم التحقق تلقائياً عند اختيار الخيار الثاني:";
            } else {
                questionHint.innerText = "";
            }
            
            optionsList.innerHTML = "";

            q.options.forEach((opt, index) => {
                const li = document.createElement("li");
                li.className = "option-item";
                li.innerText = opt;
                li.onclick = () => selectOption(index, li);
                optionsList.appendChild(li);
            });
        }

        function selectOption(index, element) {
            if (answered) return;
            const q = questions[currentIdx];

            if (q.type === "multiple") {
                const pos = selectedOptions.indexOf(index);
                if (pos > -1) {
                    selectedOptions.splice(pos, 1);
                    element.classList.remove("selected");
                } else {
                    if (selectedOptions.length < 2) {
                        selectedOptions.push(index);
                        element.classList.add("selected");
                    }
                }
                
                if (selectedOptions.length === 2) {
                    checkAnswer();
                }
            } else {
                selectedOptions = [index];
                element.classList.add("selected");
                checkAnswer();
            }
        }

        function checkAnswer() {
            if (answered) return;
            answered = true;

            const q = questions[currentIdx];
            const items = Array.from(optionsList.getElementsByTagName("li"));
            let isCorrect = false;

            if (q.type === "multiple") {
                const sortedSelected = [...selectedOptions].sort();
                const sortedCorrect = [...q.correct].sort();
                isCorrect = JSON.stringify(sortedSelected) === JSON.stringify(sortedCorrect);

                items.forEach((item, idx) => {
                    if (q.correct.includes(idx)) {
                        item.classList.add("correct");
                    } else if (selectedOptions.includes(idx)) {
                        item.classList.add("incorrect");
                    }
                });
            } else {
                const selected = selectedOptions[0];
                isCorrect = (selected === q.correct[0]);

                if (isCorrect) {
                    items[selected].classList.add("correct");
                } else {
                    items[selected].classList.add("incorrect");
                    items[q.correct[0]].classList.add("correct");
                }
            }

            if (isCorrect) {
                score++;
                scoreTracker.innerText = `النتيجة: ${score}`;
            }

            items.forEach(item => item.classList.add("disabled"));

            explanationText.innerText = q.explanation;
            explanationBox.style.display = "block";

            if (isCorrect) {
                setTimeout(() => {
                    nextQuestion();
                }, 3000);
            } else {
                nextBtn.style.display = "block";
            }
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) {
                loadQuestion();
            } else {
                quizBox.style.display = "none";
                resultBox.style.display = "block";
                finalScore.innerText = `${score} / ${questions.length}`;
            }
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            scoreTracker.innerText = `النتيجة: 0`;
            resultBox.style.display = "none";
            quizBox.style.display = "block";
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
